<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Forgot Password — LG Tousif Group</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: #05070f;
    color: #fff;
    padding: 30px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  .bg-decor {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .bg-decor::before {
    content: '';
    position: absolute;
    top: -100px; left: -100px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, #f59e0b44, transparent 70%);
    border-radius: 50%;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

  .box {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 2;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: #131829;
    border-radius: 10px;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    margin-bottom: 24px;
    border: 1px solid #ffffff0f;
  }

  .icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 22px;
    background: linear-gradient(135deg, #f59e0b, #dc2626);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 0 0 0 #f59e0b88;
    animation: pulseRing 2s ease-out infinite;
  }

  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 #f59e0b88; }
    70% { box-shadow: 0 0 0 30px #f59e0b00; }
    100% { box-shadow: 0 0 0 0 #f59e0b00; }
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 8px;
  }

  .sub {
    text-align: center;
    color: #8b93a7;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .input-group { margin-bottom: 20px; }

  .input-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #8b93a7;
    margin-bottom: 8px;
  }

  .input-wrap { position: relative; }

  .input-wrap input {
    width: 100%;
    padding: 15px 46px;
    background: #131829;
    border: 1.5px solid #ffffff0f;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.25s;
  }

  .input-wrap input:focus {
    border-color: #3B5BDB;
    background: #1a2036;
    box-shadow: 0 0 0 4px #3B5BDB22;
  }

  .input-icon-left {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #555e75;
    font-size: 16px;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #3B5BDB, #6366f1);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 8px 20px #3B5BDB44;
    margin-top: 10px;
  }

  .btn-primary:active { transform: scale(0.98); }

  .info-box {
    margin-top: 24px;
    padding: 14px;
    background: #3B5BDB11;
    border: 1px solid #3B5BDB33;
    border-radius: 12px;
    font-size: 12px;
    color: #a3b3d9;
    line-height: 1.6;
  }

  .info-box strong { color: #3B5BDB; }
</style>
</head>
<body>

<div class="bg-decor"></div>

<div class="box">
  <a href="index.html" class="back-btn">←</a>

  <div class="icon">🔑</div>
  <h1>Forgot Password?</h1>
  <p class="sub">No worries! Enter your email and we'll send you a reset link.</p>

  <div class="input-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="input-icon-left">✉</span>
      <input type="email" id="email" placeholder="example@gmail.com" />
    </div>
  </div>

  <button class="btn-primary" onclick="sendReset()">Send Reset Link</button>

  <div class="info-box">
    <strong>💡 Note:</strong> We'll send a 6-digit OTP to your email. Use it on the next page to reset your password.
  </div>
</div>

<script>
  function sendReset() {
    const email = document.getElementById('email').value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      alert('❌ Please enter a valid email address.');
      return;
    }

    // Generate OTP for password reset
    const otp = String(Math.floor(100000 + Math.random() * 900000));
    localStorage.setItem('denz_reset_email', email);
    localStorage.setItem('denz_reset_otp', otp);

    alert(`✅ Reset OTP sent to ${email}\n\n🔐 Demo OTP: ${otp}\n\n(Click OK to continue to reset page)`);
    window.location.href = 'reset.html';
  }
</script>

</body>
</html>
