<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Esports Denz Arena — Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    background: #0F1420;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
  }

  /* LOGO */
  .logo {
    width: 160px;
    height: 160px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo svg {
    width: 100%;
    height: 100%;
  }

  /* LABEL */
  label {
    display: block;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 8px;
  }

  /* INPUT WRAPPER */
  .input-wrap {
    position: relative;
    margin-bottom: 18px;
  }

  input {
    width: 100%;
    padding: 14px 44px 14px 16px;
    border: none;
    border-radius: 10px;
    background: #fff;
    color: #333;
    font-size: 15px;
    outline: none;
  }

  input::placeholder { color: #aaa; }

  input:focus {
    box-shadow: 0 0 0 2px #3B5BDB;
  }

  /* ICON INSIDE INPUT */
  .icon-right {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #555;
    font-size: 18px;
    user-select: none;
  }

  .check { color: #22c55e; display: none; }
  .check.show { display: block; }

  /* FORGOT */
  .forgot {
    text-align: right;
    margin-bottom: 22px;
  }

  .forgot a {
    color: #00BFA5;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }

  /* LOGIN BUTTON */
  .btn-login {
    width: 100%;
    padding: 15px;
    background: #3B5BDB;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-login:hover { background: #2f4bbf; }

  .btn-login:active { transform: scale(0.98); }

  /* FOOTER */
  .footer {
    text-align: center;
    color: #ccc;
    font-size: 14px;
    margin-top: 24px;
  }

  .footer a {
    color: #3B5BDB;
    font-weight: 600;
    text-decoration: none;
  }

  /* ERROR */
  .error {
    color: #ef4444;
    font-size: 13px;
    margin-top: -12px;
    margin-bottom: 14px;
    display: none;
  }

  .error.show { display: block; }
</style>
</head>
<body>

<div class="login-box">

  <!-- LOGO (placeholder) -->
  <div class="logo">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22c55e"/>
          <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
      </defs>
      <path d="M100 10 L180 45 L180 120 Q180 170 100 190 Q20 170 20 120 L20 45 Z"
            fill="#0F1420" stroke="url(#g)" stroke-width="6"/>
      <text x="100" y="95" text-anchor="middle" fill="#fff"
            font-family="Arial" font-weight="bold" font-size="20">ESPORTS</text>
      <text x="100" y="125" text-anchor="middle" fill="url(#g)"
            font-family="Arial" font-weight="bold" font-size="22">DENZ</text>
      <text x="100" y="150" text-anchor="middle" fill="#fff"
            font-family="Arial" font-weight="bold" font-size="20">ARENA</text>
    </svg>
  </div>

  <!-- EMAIL -->
  <label>Email</label>
  <div class="input-wrap">
    <input type="email" id="email" placeholder="example@gmail.com" />
    <span class="icon-right check" id="checkIcon">✔</span>
  </div>

  <!-- PASSWORD -->
  <label>Password</label>
  <div class="input-wrap">
    <input type="password" id="password" placeholder="Enter your password" />
    <span class="icon-right" id="eyeIcon" onclick="togglePassword()">👁</span>
  </div>

  <!-- ERROR MESSAGE -->
  <p class="error" id="errorMsg">Please fill all fields correctly.</p>

  <!-- FORGOT -->
  <div class="forgot">
    <a href="#">Forget password?</a>
  </div>

  <!-- LOGIN BUTTON -->
  <button class="btn-login" onclick="loginUser()">Login</button>

  <!-- FOOTER -->
  <p class="footer">
    Don't have an account? <a href="#" onclick="alert('Signup page coming soon!')">Signup</a>
  </p>
</div>

<script>
  const emailInput = document.getElementById('email');
  const passInput  = document.getElementById('password');
  const checkIcon  = document.getElementById('checkIcon');
  const eyeIcon    = document.getElementById('eyeIcon');
  const errorMsg   = document.getElementById('errorMsg');

  // Email checkmark
  emailInput.addEventListener('input', () => {
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
    checkIcon.classList.toggle('show', valid);
  });

  // Password show/hide
  function togglePassword() {
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.textContent = '🙈';
    } else {
      passInput.type = 'password';
      eyeIcon.textContent = '👁';
    }
  }

  // Login
  function loginUser() {
    const email = emailInput.value.trim();
    const pass  = passInput.value.trim();

    if (!email || !pass) {
      errorMsg.textContent = 'Please fill all fields.';
      errorMsg.classList.add('show');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorMsg.textContent = 'Please enter a valid email.';
      errorMsg.classList.add('show');
      return;
    }

    if (pass.length < 6) {
      errorMsg.textContent = 'Password must be at least 6 characters.';
      errorMsg.classList.add('show');
      return;
    }

    errorMsg.classList.remove('show');

    // Save to localStorage (fake login for now)
    localStorage.setItem('denz_user', JSON.stringify({ email }));
    alert('Login successful! ✅');
    window.location.href = 'home.html';
  }
</script>

</body>
</html>
