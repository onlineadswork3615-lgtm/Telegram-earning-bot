<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Wallet — Esports Denz Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

  body {
    background: #0a0e1a;
    color: #fff;
    padding-bottom: 90px;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    gap: 14px;
  }

  .back-btn {
    font-size: 22px;
    color: #fff;
    text-decoration: none;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a2036;
    border-radius: 10px;
  }

  .header-title {
    font-size: 18px;
    font-weight: 800;
  }

  /* BALANCE CARD */
  .balance-card {
    margin: 10px 16px 24px;
    background: linear-gradient(135deg, #3B5BDB, #6366f1);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 12px 32px rgba(59, 91, 219, 0.35);
    position: relative;
    overflow: hidden;
  }

  .balance-card::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
  }

  .balance-label {
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .balance-amount {
    font-size: 38px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 2;
  }

  .coin-big {
    width: 32px;
    height: 32px;
    background: radial-gradient(circle at 30% 30%, #ffe066, #d4a017);
    border-radius: 50%;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3);
  }

  .add-money {
    margin-top: 16px;
    background: #fff;
    color: #3B5BDB;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    position: relative;
    z-index: 2;
  }

  /* TRANSACTIONS */
  .section-title {
    padding: 0 18px 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }

  .txn-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .txn-item {
    background: #131829;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #ffffff0d;
  }

  .txn-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .txn-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .txn-icon.credit { background: #16a34a33; color: #22c55e; }
  .txn-icon.debit  { background: #dc262633; color: #ef4444; }

  .txn-info .txn-title {
    font-size: 13px;
    font-weight: 600;
  }

  .txn-info .txn-date {
    font-size: 11px;
    color: #8b93a7;
    margin-top: 2px;
  }

  .txn-amount {
    font-size: 15px;
    font-weight: 800;
  }

  .txn-amount.credit { color: #22c55e; }
  .txn-amount.debit  { color: #ef4444; }

  .empty-txn {
    text-align: center;
    padding: 40px 20px;
    color: #8b93a7;
    font-size: 13px;
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 480px;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a1f33, #131829);
    display: flex;
    justify-content: space-around;
    padding: 12px 0 14px;
    border-top: 1px solid #ffffff1a;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
  }

  .nav-item {
    flex: 1;
    text-align: center;
    font-size: 10px;
    color: #8b93a7;
    cursor: pointer;
    font-weight: 500;
  }

  .nav-item.active { color: #fff; font-weight: 700; }

  .nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    width: 36px;
    height: 36px;
    margin: 0 auto 4px;
    border-radius: 12px;
  }

  .nav-item.active .nav-icon {
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: #fff;
  }
</style>
</head>
<body>

<div class="header">
  <a href="profile.html" class="back-btn">←</a>
  <div class="header-title">My Wallet</div>
</div>

<!-- BALANCE -->
<div class="balance-card">
  <div class="balance-label">Total Balance</div>
  <div class="balance-amount">
    <span class="coin-big"></span>
    <span id="walletBalance">0</span>
  </div>
  <button class="add-money" onclick="addMoney()">+ Add Money</button>
</div>

<!-- TRANSACTIONS -->
<div class="section-title">Recent Transactions</div>
<div class="txn-list" id="txnList"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item" onclick="alert('Gifts coming soon')">
    <div class="nav-icon">🎁</div>Gifts
  </div>
  <div class="nav-item" onclick="alert('Quizzes coming soon')">
    <div class="nav-icon">❓</div>Quizzes
  </div>
  <div class="nav-item" onclick="window.location.href='home.html'">
    <div class="nav-icon">🏠</div>Home
  </div>
  <div class="nav-item" onclick="alert('Winners coming soon')">
    <div class="nav-icon">🏆</div>Winners
  </div>
  <div class="nav-item" onclick="window.location.href='profile.html'">
    <div class="nav-icon">👤</div>Profile
  </div>
</div>

<script>
  const user = localStorage.getItem('denz_user');
  if (!user) window.location.href = 'index.html';

  let balance = parseInt(localStorage.getItem('denz_coin') || '0');
  document.getElementById('walletBalance').textContent = balance;

  let transactions = JSON.parse(localStorage.getItem('denz_transactions') || '[]');

  function renderTxns() {
    const list = document.getElementById('txnList');
    if (transactions.length === 0) {
      list.innerHTML = '<div class="empty-txn">No transactions yet</div>';
      return;
    }
    list.innerHTML = transactions.map(t => `
      <div class="txn-item">
        <div class="txn-left">
          <div class="txn-icon ${t.type}">${t.type === 'credit' ? '↓' : '↑'}</div>
          <div class="txn-info">
            <div class="txn-title">${t.title}</div>
            <div class="txn-date">${t.date}</div>
          </div>
        </div>
        <div class="txn-amount ${t.type}">${t.type === 'credit' ? '+' : '-'}₹${t.amount}</div>
      </div>
    `).join('');
  }

  function addMoney() {
    const amount = prompt('Enter amount to add (₹):');
    if (!amount || isNaN(amount) || amount <= 0) return;

    balance += parseInt(amount);
    localStorage.setItem('denz_coin', balance);

    transactions.unshift({
      type: 'credit',
      title: 'Money Added',
      amount: parseInt(amount),
      date: new Date().toLocaleString()
    });
    localStorage.setItem('denz_transactions', JSON.stringify(transactions));

    document.getElementById('walletBalance').textContent = balance;
    renderTxns();
    alert('✅ ₹' + amount + ' added to wallet');
  }

  renderTxns();
</script>

</body>
</html>
